		</g>
	</g>

	<!-- Text -->
	<g transform="translate(100,20)">
		<text x="0" y="20"
			  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
			  font-size="24"
			  font-weight="600"
			  fill="#036ac4">
			Trip<tspan fill="#000">Planner</tspan>
		</text>
		<text x="0" y="40"
			  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
			  font-size="11"
			  letter-spacing="0.08em"
			  fill="#7B8794">
			TRIPS · PLACES
		</text>
	</g>
