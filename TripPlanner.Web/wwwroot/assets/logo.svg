<svg width="260" height="70" viewBox="0 0 260 70" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#036ac4"/>
			<stop offset="100%" stop-color="#27AE60"/>
		</linearGradient>
	</defs>

	<!-- Icon -->
	<g transform="translate(10,10)">
		<!-- Map shape -->
		<path d="M5 8 L30 2 L50 8 L75 2 L75 42 L50 48 L30 42 L5 48 Z"
			  fill="#F4F7FB" stroke="#CBD4E6" stroke-width="1.5"/>

		<!-- Route -->
		<path d="
    M15 40
    C 20 36, 26 34, 30 30
    C 34 26, 38 24, 42 26
    C 46 28, 48 32, 52 30
    C 56 28, 60 22, 63 24
    C 66 26, 70 20, 68 14
    C 66 10, 62 8, 58 10
  "
		  fill="none"
		  stroke="#036ac4"
		  stroke-width="2.2"
		  stroke-linecap="round"
		  stroke-linejoin="round"/>


		<!-- Pin -->
		<g transform="translate(36,10)">
			<path d="M14 0 C8 -0.1 3.5 4.3 3.5 10.2 C3.5 16.8 10 23.5 14 28
               C18 23.5 24.5 16.8 24.5 10.2 C24.5 4.3 20 0 14 0 Z"
